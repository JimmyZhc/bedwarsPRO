# ===================================================
# BedwarsPRO 快捷物品配置（进入世界自动发放 + 右键执行指令）
# ===================================================
# 说明：
#   - 玩家进入符合条件的世界时，自动在快捷栏指定槽位发放列表中的物品
#   - 右键对应物品执行该物品配置的指令
#
# 注意：
#   - 与计分板一致，本功能仅在一端多图（非 BungeeCord，bungeecord.enabled: false）模式生效
#   - 为避免覆盖玩家物品：目标槽位已有物品时会放入快捷栏第一个空位；
#     若整个快捷栏已满则不再发放
# ===================================================

# 总开关（默认关闭）
enabled: false

# 世界模式（对所有物品生效）：
#   whitelist = 白名单：仅 worlds 列表中的世界发放物品
#   blacklist = 黑名单：worlds 列表中的世界不发放，其余世界发放
world-mode: whitelist

# 生效世界列表（填写世界文件夹名，例如 world、lobby、survival）
worlds:
  - world
  - lobby

# ==================== 物品列表 ====================
# 每个物品支持字段：
#   material  - Bukkit 材质名（下界之星 NETHER_STAR、粘液球 SLIME_BALL 等）
#   name      - 显示名（支持 & 颜色代码）
#   lore      - 描述（支持 & 颜色代码，可留空）
#   slot      - 放置槽位（快捷栏 0-8，0 为第一格，8 为最后一格）
#   command   - 右键时执行的指令（注意不要带 /）
#   cooldown  - 右键防抖间隔（tick，20 tick = 1 秒）
# ====================================================

items:
  # 第一格：任务系统（下界之星）
  - material: NETHER_STAR
    name: "&e&l任务系统"
    lore:
      - "&7右键打开任务系统"
    slot: 0
    command: "bwpro task gui"
    cooldown: 5

  # 最后一格：大厅（粘液球）
  - material: SLIME_BALL
    name: "&b&l大厅"
    lore:
      - "&7右键返回主城"
    slot: 8
    command: "hub"
    cooldown: 5
