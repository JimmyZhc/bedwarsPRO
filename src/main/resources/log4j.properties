# 插件内置 log4j 1.2 配置（Properties 格式）
# 不用 log4j.xml：XML 配置会把插件 JAR 的路径当 URL 解析，路径含中文时
# DOMConfigurator 会报 MalformedURIException（Opaque part contains invalid character）。
# Properties 格式纯文本解析，无此问题。
# 日志级别 WARN：只输出警告/错误，避免刷屏
log4j.rootLogger=WARN, stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=[%d{HH:mm:ss} %-5p] %c{1}: %m%n
