#出生点、资源点保护
spawn_no_build:

  #出生点保护
  spawn:

    #是否启用
    enabled: true

    #范围
    range: 1

  #资源点保护
  resource:

    #是否启用
    enabled: false

    #范围
    range: 2

  #提示
  message: "&c你不能在这里放置方块！"


#全息显示图
holographic:

  #资源生成点全息显示
  resource:

    #是否启用
    enabled: false

    #旋转速度
    speed: 1.0

    #资源生成点
    resources:

      #格式:
      #
      #资源名称(可自定义)
      #diamond:
      #
      #  资源的物品ID
