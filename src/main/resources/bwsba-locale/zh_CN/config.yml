#玩家头顶名称称号
#变量:
# {team}               玩家队伍名称
# {team_initials}      玩家队伍名称首字母
# {color}              玩家队伍颜色
# {color_name}         玩家队伍颜色名称
# {color_initials}     玩家队伍颜色名称首字母
playertag:

  #前缀
  prefix: "{color}{team} &f| {color}"

  #后缀
  suffix: ""


#日期格式
date_format: "MM/dd/yy"

#等待大厅计分板
lobby_scoreboard:

  #是否启用
  enabled: true

  #计分板刷新间隔(tick)
  # 1 秒 = 20 tick
  interval: 2

#计分板设置
scoreboard:

  #计分板刷新间隔(tick)
  # 1 秒 = 20 tick
  interval: 2

  #变量 {you} 的值
  you: "&7(你)"

  #队伍床状态
  team_bed_status:

    #床存在
    bed_alive: "&a\u2714"

    #床被摧毁
    bed_destroyed: "&c\u2718"

    #床存在(空队)
    bed_alive_empty: "&a\u2714"

  #队伍状态格式
  #变量:
  # {color}            队伍颜色
  # {team}             队伍名称
  # {players}          队伍人数
  team_status_format:

    #床存在
    bed_alive: "{color} {team} &a\u2714 &8(&f&l{players}&8) {you}"

    #床被摧毁
    bed_destroyed: "{color} {team} &c\u2718 &8(&f&l{players}&8) {you}"

    #床存在(空队)
    bed_alive_empty: "{color} {team} &a\u2714 &8(&f&l{players}&8) {you}"

    #队伍被消灭
    team_dead: "{color} {team} &c\u2718 &8(&f&l{players}&8) {you}"
