#配置版本 (请勿修改!)
version: 23

#许可证密钥 (需空一格，且把引号部分全部删掉)
license-key: ""


#更新检测
update_check:

  #是否启用
  enabled:  true

  #向在线管理员报告版本更新
  report: true


#区域语言
locale: zh_CN


#初始化调试
#  当插件加载失败时启用此项
#  启用后将显示详细错误报告
init_debug: false


#隐藏非游戏玩家
hide_player: true


#Tab血量显示
tab_health: true


#头顶血量显示
tag_health: true


#合并掉落物品
item_merge: false


#改变饥饿值
hunger_change: false


#喝药水清除玻璃瓶
clear_bottle: true


#快速重生
fast_respawn: true


#聊天格式
chat_format:

  #是否启用
  enabled: true

  #发言权限
  chat:

    #大厅
    lobby: true

    #全体聊天
    all: true

    #旁观者
    spectator: true
    

  #全体聊天前缀
  all_prefix:
  - "!"
  - "#"
  - "@"

  #大厅聊天格式
  lobby: "{player} > {message}"

  #已选择队伍大厅聊天格式
  lobby_team: "{color}{player} &f> {message}"

  #游戏中聊天格式
  ingame: "&7[{color}{team}&7] {color}{player} &f> {message}"

  #游戏中全体聊天格式
  ingame_all: "&7[&f全体&7] &7[{color}{team}&7] {color}{player} &f> {message}"

  #旁观者聊天格式
  spectator: "&7[&f旁观者&7] &f{player} > {message}"


#最终击杀显示
final_killed:

  #是否启用
  enabled: true

  #信息
  message: "&6{player} &6被击杀，击杀者： {killer} &b&l最终击杀"


#定时执行命令
#变量:
# {player}   所有游戏中玩家
timecommand:

  startcommand:
    - ""

  event1:
    gametime: 3420
    command:
    - "title @a title {\"text\":\"\",\"color\":\"dark_red\"}"
    - "title @a subtitle {\"text\":\"产金速率变更\",\"color\":\"dark_red\"}"

  event2:
    gametime: 3240
    command:
    - "title @a title {\"text\":\"\",\"color\":\"dark_red\"}"
    - "title @a subtitle {\"text\":\"第二岛屿刷新僵尸\",\"color\":\"dark_red\"}"
    - "zombie_spawn gold_spawners"

  event3:
    gametime: 3060
    command:
    - "trigger_random_event"

  event4:
    gametime: 2880
    command:
    - "title @a title {\"text\":\"\",\"color\":\"dark_red\"}"
    - "title @a subtitle {\"text\":\"产钻速率变更\",\"color\":\"dark_red\"}"

  event5:
    gametime: 2700
    command:
    - "title @a title {\"text\":\"\",\"color\":\"dark_red\"}"
    - "title @a subtitle {\"text\":\"第一岛屿刷新僵尸猪人\",\"color\":\"dark_red\"}"
    - "zombie_pigman_spawn diamond_spawners"

  event6:
    gametime: 2520
    command:
    - "title @a title {\"text\":\"\",\"color\":\"dark_red\"}"
    - "title @a subtitle {\"text\":\"所有床已被摧毁\",\"color\":\"dark_red\"}"
    - "destroy_all_beds"


#队伍选择菜单
select_team:

  #是否启用
  enabled: true

  #队伍状态
  status:

    select: "&e点击选择！"
    inteam: "&e已在队伍中！"
    team_full: "&c队伍已满！"

  #无玩家
  no_players: "&7(无)"

  #队伍选项物品
  item:

    #物品名称
    name: "{color}{team}"

    #描述
    lore:
    - ""
    - "&f玩家: &e{players}&7/&e{maxplayers}"
    - ""
    - "&f玩家列表:"
    - "  {color}{players_list}"
    - ""
    - "{status}"


#清除大厅方块
lobby_block:

  #是否启用
  enabled: false

  #范围1
  position_1:
    x: 12
    y: 10
    z: 12

  #范围2
  position_2:
    x: -12
    y: -5
    z: -12


#掉线重连
rejoin:

  #是否启用
  enabled: true

  #信息
  message:

    #重新加入成功
    rejoin: "&e{player} 重新加入了游戏！"

    #重新加入失败
    error: "&c无法重新加入游戏！"


#弓箭伤害显示
#变量:
# {player}     玩家名称
# {damage}     造成伤害值
# {health}     玩家剩余血量
# {maxhealth}  玩家最大血量
bowdamage:

  #是否启用
  enabled: false

  #大标题
  title: ""

  #小标题
  subtitle: ""

  #显示信息
  message: "&f你对玩家 &a{player} &f造成了 &a{damage} &f点伤害 血量 &a{health}/{maxhealth}"

#伤害显示
#变量:
# {player}     玩家名称
# {damage}     造成伤害值
# {health}     玩家剩余血量
# {maxhealth}  玩家最大血量
damagetitle:

  #是否启用
  enabled: false

  #大标题
  title: ""

  #小标题
  subtitle: "&b伤害 &f- &e{damage}  &b血量 &f- &e{health}&f/&e{maxhealth}"


#玩家加入游戏时的标题
#变量:
# {player}   玩家名称
jointitle:

  #是否启用
  enabled: true

  #大标题
  title: "&f{player}&a加入了游戏"

  #小标题
  subtitle: ""


#游戏开始后标题
start_title:

  #是否启用
  enabled: true

  #大标题
  title:
    - "&a游戏开始！"
    - "&e保护好你的床！"

  #小标题
  subtitle: ""


#床被摧毁标题
destroyed_title:

  #是否启用
  enabled: true

  #大标题
  title: "&c床被摧毁"

  #小标题
  subtitle: "&7你将不能重生!"


#胜利标题
#变量:
#  {color}    胜利队伍颜色
#  {team}     胜利队伍名称
#  {time}     胜利耗时
victory_title:

  #是否启用
  enabled: true

  #大标题
  title:
    - "&6&l恭喜！"

  #小标题
  subtitle: "{color}{team} §f获得胜利，用时：§6{time}"


#播放声音
play_sound:

  #是否启用
  enabled: true

  #声音
  #  随机播放列表中的声音
  #  使用 {} 关闭声音
  #  格式:
  #    - <声音>,<音量>,<音调>
  sound:

    #游戏开始
    start:
    - ENDERDRAGON_GROWL,1,1

    #死亡
    death: {}

    #击杀
    kill:
    - CAT_MEOW,1,1
    - WOLF_BARK,1,1

    #资源升级
    upgrade: {}

    #血量设置
    sethealth: {}

    #资源不足
    no_resource:
    - ENDERMAN_TELEPORT,1,0.5

    #启用凋零弓
    enable_witherbow:
    - ENDERDRAGON_GROWL,1,1

    #使用凋零弓
    witherbow:
    - WITHER_HURT,1,0

    #死亡模式
    deathmode: {}

    #游戏结束
    over:
    - ENDERDRAGON_DEATH,1,1


#旁观设置
spectator:

  #是否启用
  enabled: true

  #在地图中心
  centre:

    #是否启用
    enabled: true

    #高度
    height: 120

  #旁观玩家时
  spectator_target:

    #标题
    title: "&a正在旁观&7{player}"

    #小标题
    subtitle: "&a点击左键打开菜单   &c按Shift键退出"

  #退出旁观时
  quit_spectator:

    #标题
    title: ""

    #小标题
    subtitle: "&e退出旁观模式"

  #旁观者速度设置
  speed:

    #是否启用
    enabled: true

    #物品位置
    slot: 5

    #物品数字ID
    item: 404

    #物品名称
    item_name: "&a旁观设置"

    #物品描述
    item_lore: {}

    #菜单标题
    gui_title: "旁观者设置"

    #速度描述
    no_speed: "&a没有速度效果"
    speed_1: "&a速度 I"
    speed_2: "&a速度 II"
    speed_3: "&a速度 III"
    speed_4: "&a速度 IV"

  #快速加入 (需要前置 ServerJoiner)
  fast_join:

    #是否启用
    enabled: false

    #物品位置
    slot: 8

    #物品数字ID
    item: 339

    #物品名称
    item_name: "&a再玩一局"

    #物品描述
    item_lore: {}

    #ServerJoiner服务器组
    group: "bedwars"




  #资源
  resources:
    CLAY_BRICK: "&4红砖"
    IRON_INGOT: "&7铁锭"
    GOLD_INGOT: "&6金锭"
    DIAMOND: "&b钻石"

  #物品名称
  item:
    III_II: "&a你好( \uff9f\u25e1\uff9f)/！"
    IV_II: "&a我回到基地了！"
    V_II: "&a我正在防守！"
    VI_II: "&a我正在进攻！"
    VII_II: "&a我正在收集资源！"
    VIII_II: "&a我有资源！"
    III_III: "&a谢谢！"
    IV_III: "&a返回基地！"
    V_III: "&a请防守！"
    VI_III: "&a我们进攻！"
    VII_III: "&a我需要资源！"

  #信息
  message:
    III_II: "&a&l队伍> &7{player}&f: &a你好( \uff9f\u25e1\uff9f)/"
    IV_II: "&a&l队伍> &7{player}&f: &a我回到基地了"
    V_II: "&a&l队伍> &7{player}&f: &a我正在防守"
    VI_II: "&a&l队伍> &7{player}&f: &a我正在进攻 {color}{team}"
    VII_II: "&a&l队伍> &7{player}&f: &a我正在收集 {resource}"
    VIII_II: "&a&l队伍> &7{player}&f: &a我有 {resource}"
    III_III: "&a&l队伍> &7{player}&f: &a谢谢"
    IV_III: "&a&l队伍> &7{player}&f: &a返回基地"
    V_III: "&a&l队伍> &7{player}&f: &a请防守"
    VI_III: "&a&l队伍> &7{player}&f: &a我们进攻 {color}{team}"
    VII_III: "&a&l队伍> &7{player}&f: &a我需要 {resource}"


#喷漆涂鸦
graffiti:

  #是否启用
  enabled: true

  #全息显示
  holographic:

    #是否启用
    enabled: true

    #全息文本
    text: "&e点击！"


#商店
shop:

  #是否启用
  enabled: true

  #物品商店
  item_shop:

    #NPC类型
    type: VILLAGER

    #皮肤
    skin: Steve

    #商店名称
    name:
      - "&f商店"

    #NPC视角跟随附近玩家
    look: false

  #队伍商店
  team_shop:

    #NPC类型
    type: BLAZE

    #皮肤
    skin: Steve

    #商店名称
    name:
      - "&f商店"

    #NPC视角跟随附近玩家
    look: false


#倒计时重生设置
respawn:

  #是否启用
  enabled: true

  #在地图中心倒计时
  centre:

    #是否启用
    enabled: true

    #高度
    height: 120

  #重生时间(秒)
  respawn_delay: 5

  #重生保护时间
  protected:

    #启用
    enabled: true

    #时间 (秒)
    time: 5

  #正在重生时
  countdown:

    #大标题
    title: "&e{respawntime}"

    #小标题
    subtitle: "&a秒后复活"

    #信息
    message: ""

  #已经重生
  respawn:

    #大标题
    title: "&a已重生"

    #小标题
    subtitle: ""

    #信息
    message: "&a你已重生！"


#物品给予
giveitem:

  #死亡后不重置护甲
  keeparmor: false

  #护甲
  armor:

    #头盔
    helmet:

      #给予选项
      #  true        游戏开始、重生时给予
      #  start       游戏开始时给予
      #  respawn     重生时给予
      #  false       不给予
      give: true

      #护甲是否可以脱下
      move: true

      #物品
      item:
      - type: TEAM_ARMOR
        meta:
          ==: ItemMeta
          meta-type: LEATHER_ARMOR
          enchants:
            WATER_WORKER: 1
          Unbreakable: true
        probability: 1

    #胸甲
    chestplate:

      #给予选项
      #  true        游戏开始、重生时给予
      #  start       游戏开始时给予
      #  respawn     重生时给予
      #  false       不给予
      give: true

      #护甲是否可以脱下
      move: true

      #物品
      item:
      - type: TEAM_ARMOR
        meta:
          ==: ItemMeta
          meta-type: LEATHER_ARMOR
          Unbreakable: true
        probability: 1

    #护腿
    leggings:

      #给予选项
      #  true        游戏开始、重生时给予
      #  start       游戏开始时给予
      #  respawn     重生时给予
      #  false       不给予
      give: true

      #护甲是否可以脱下
      move: true

      #物品
      item:
      - type: TEAM_ARMOR
        meta:
          ==: ItemMeta
          meta-type: LEATHER_ARMOR
          Unbreakable: true
        probability: 1

    #靴子
    boots:

      #给予选项
      #  true        游戏开始、重生时给予
      #  start       游戏开始时给予
      #  respawn     重生时给予
      #  false       不给予
      give: true

      #护甲是否可以脱下
      move: true

      #物品
      item:
      - type: TEAM_ARMOR
        meta:
          ==: ItemMeta
          meta-type: LEATHER_ARMOR
          Unbreakable: true
        probability: 1

  #物品栏
  #
  #格式:
  #
  #  #物品名称
  #  item1:
  #
  #    #给予选项
  #    #  true        游戏开始、重生时给予
  #    #  start       游戏开始时给予
  #    #  respawn     重生时给予
  #    #  false       不给予
  #    give: true
  #   
  #    #物品所在背包的位置
  #    slot: 0
  #    
  #    #物品
  #    item:
  #    - type: WOOD_SWORD
  #      meta:
  #        ==: ItemMeta
  #        meta-type: UNSPECIFIC
  #        Unbreakable: true
  #      probability: 1
  item:

    #物品名称
    item1:

      #给予选项
      #  true        游戏开始、重生时给予
      #  start       游戏开始时给予
      #  respawn     重生时给予
      #  false       不给予
      give: true

      #物品所在背包的位置
      slot: 0

      #物品
      item:
      - type: WOOD_SWORD
        meta:
          ==: ItemMeta
          meta-type: UNSPECIFIC
          Unbreakable: true
        probability: 1

#血量设置
sethealth:

  #开始游戏时设置血量
  start:

    #是否启用
    enabled: true

    #设置血量
    health: 20

  #编号
  1:

    #当游戏剩余多少秒时改变血量
    gametime: 2700

    #设置血量
    health: 30

    #显示大标题消息
    title: "&b全体血量提升!"

    #显示小标题消息
    subtitle: ""

    #显示的信息
    message: ""

  #编号
  2:

    #当游戏剩余多少秒时改变血量
    gametime: 1500

    #设置血量
    health: 40

    #显示大标题消息
    title: "&b全体血量提升!"

    #显示小标题消息
    subtitle: ""

    #显示的信息
    message: ""


#资源点升级
resourceupgrade:
  1:
    gametime: 3420
    upgrade:
      - "GOLD_INGOT,160"
    message: "&6金锭生成点&e已升至&cII&e级"
  2:
    gametime: 2880
    upgrade:
      - "DIAMOND,500"
    message: "&b钻石生成点&e已升至&cII&e级"


#资源数量上限
resourcelimit:

  #是否启用
  enabled: true

  #设置上限
  limit:
    - 'CLAY_BRICK,45'
    - 'IRON_INGOT,30'
    - 'GOLD_INGOT,5'
    - 'DIAMOND,8'


#均匀地散布队伍资源点(铁锻炉)
spread_resource:

  #是否启用
  enabled: true

  #锁定玩家抛射物品(适用于大范围散布)
  launch: false

  #半径范围
  range: 1.0


#个人、队伍箱子
game_chest:

  #是否启用
  enabled: true

  #箱子与出生点距离
  #用于自动检测箱子位置
  range: 10

  #当打开未被淘汰队伍箱子时
  message: "&c{team} 团队还未被淘汰，你无法打开这个箱子！"


#隐藏隐身玩家(喝隐身药水时触发)
invisibility_player:

  #是否启用
  enabled: true

  #显示足迹
  footstep: true

  #隐藏药水效果
  hide_particles: true

  #隐身玩家被攻击时显示身体(默认只显示盔甲)
  damage_show_player: false


#凋零弓
witherbow:

  #是否启用
  #禁用后倒计时任然继续，但不会开启凋零弓
  enabled: true

  #当游戏剩余多少秒时开启
  gametime: 2400

  #当凋零弓开启后变量 {bowtime} 的值
  already_starte: "已开启"

  #凋零弓开启时的大标题
  title: "&b&l凋零弓"

  #凋零弓开启时的小标题
  subtitle: "&f所有箭矢将替换为凋零头颅"

  #凋零弓开启时的提示
  message: "&b凋零弓已开启，所有箭矢将替换为凋零头颅！"


#死亡模式
deathmode:

  #是否启用
  enabled: true

  #当游戏剩余多少秒时开启
  gametime: 900

  #显示大标题消息
  title: "&c&l死亡模式"

  #显示小标题消息
  subtitle: "&f所有队伍床被破坏！"

  #显示的信息
  message: "&f死亡模式开启，所有队伍床被破坏！"


#击杀资源抢夺
deathitem:

  #是否启用
  enabled: true

  #启用物品
  items:
    - 'CLAY_BRICK'
    - 'IRON_INGOT'
    - 'GOLD_INGOT'
    - 'DIAMOND'

  #汉化物品名称
  item_name_chinesize: true

  #显示的信息
  #变量:
  # {amount}           物品数量
  # {item}             物品名称
  message: "+{amount} {item}"


#禁止摧毁床
nobreakbed:

  #是否启用
  enabled: false

  #当游戏剩余多少秒时取消禁止
  gametime: 3300

  #显示的信息
  nobreakmessage: "&f游戏开始后5分钟内禁止破坏床！"

  #显示大标题消息
  title: ""

  #显示小标题消息
  subtitle: ""

  #显示的信息
