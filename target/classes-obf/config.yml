# -------- 基础设置 --------
chat-prefix: '&b起床战争§7>>'
plugin-metrics: false
send-error-data: false
global-chat-after-end: true
gamelength: 60
allow-crafting: false
overwrite-names: false
lobby-gamemode: 0

# -------- 全息统计信息 --------
holographic-stats:
  show-prefix: false
  name-color: '&7'
  value-color: '&3'
  head-line: 起床战争

# -------- 队伍与聊天 --------
teamname-on-tab: false
teamname-in-chat: true
hearts-on-death: true
die-on-void: true
lobbytime: 60
lobby-chatformat: '§7$player$§7: $msg$'
ingame-chatformat-all: '&7[&fALL&7]$player$&f: $msg$'
ingame-chatformat: '$player$&f: $msg$'
game-block: BED_BLOCK
store-game-records: true
store-game-records-holder: true
bed-sound: ENDERDRAGON_GROWL
player-drops: false
keep-inventory-on-death: false
place-in-liquid: true

# -------- 可破坏方块列表 --------
breakable-blocks:
  use-as-blacklist: false
  list:
    - none

# -------- 队伍选择实体 --------
jointeam-entity:
  show-name: true

# -------- 等待大厅计分板 --------
lobby-scoreboard:
  enabled: true
  title: §d§l起床战争
  content:
    - §eModified By JmmYm

# -------- 游戏内计分板（合并 bw + bwsba） --------
scoreboard:
  format-bed-destroyed: $team$ $status$
  format-bed-alive: $team$ $status$
  format-title: '&e&l起床战争'
  interval: 2
  you: "&7(你)"
  team_bed_status:
    bed_alive: "&a✔"
    bed_destroyed: "&c✘"
    bed_alive_empty: "&a✔"
  team_status_format:
    bed_alive: "{color} {team} &a✔ &8(&f&l{players}&8) {you}"
    bed_destroyed: "{color} {team} &c✘ &8(&f&l{players}&8) {you}"
    bed_alive_empty: "{color} {team} &a✔ &8(&f&l{players}&8) {you}"
    team_dead: "{color} {team} &c✘ &8(&f&l{players}&8) {you}"

# -------- 标题动画（Title） --------
titles:
  win:
    enabled: true
    title-stay: 5.0
    title-fade-out: 2.0
    subtitle-fade-in: 1.5
    subtitle-fade-out: 2.0
  map:
    enabled: false
    title-stay: 2.0
    subtitle-fade-in: 1.5
    subtitle-fade-out: 1.5
  countdown:
    enabled: true
    format: '&3{countdown}'

# -------- 爆炸相关 --------
explodes:
  destroy-worldblocks: false
  destroy-beds: false

# -------- 玩家交互 --------
friendlyfire: false
friendlybreak: false
gameoverdelay: 20
use-internal-shop: true
save-inventory: false
show-team-in-actionbar: false
chat-to-all-prefix: {}
seperate-game-chat: true
seperate-spectator-chat: true

# -------- 统计系统 --------
statistics:
  enabled: false
  show-on-game-end: false
  storage: database
  bed-destroyed-kills: false
  scores:
    kill: 2
    die: 0
    win: 30
    bed-destroy: 5
    lose: 0
    record: 10
  player-leave-kills: false

# -------- 数据库（仅当 storage: database） --------
database:
  host: localhost
  port: 3306
  db: bedwars
  user: root
  password: root
  table-prefix: bw_

# -------- 任务系统数据库同步（多服共享任务进度，需连接以上数据库） --------
# 启用后，玩家的任务领取时间、领取的任务、完成进度等会写入数据库，并在启动时读取
task-database:
  enabled: false

# -------- 快捷存储数据库同步（多服共享玩家快捷存入开关，需连接以上数据库） --------
# 启用后，玩家快捷存入的开/关状态写入数据库，跨服同步；关闭则仅保存在本地 QuickStash/players.yml
quickstash-database:
  enabled: false

# -------- 观战与复活 --------
spectation-enabled: true
respawn-protection: 0
allowed-commands:
  - /hub

# -------- 游戏结束行为 --------
endgame:
  mainlobby-enabled: false
  all-players-to-mainlobby: false

# -------- BungeeCord 群组服设置 --------
# enabled: false = 一端多图模式（游戏结束重置该图，不重启服务器）
# enabled: true  = 一端一图模式（游戏结束重启整个服务器，需配合BC群组服）
bungeecord:
  enabled: false
  hubserver: lobby
  endgame-in-lobby: false
  full-restart: false
  spigot-restart: false
  motds:
    lobby: '&a等待中...'
    running: '&7[&b$currentplayers$&7/&b$maxplayers$&7]'
    stopped: |
      $regionname$
      &c[已停止]
    full: |
      $regionname$
      &7[&b$currentplayers$&7/&b$maxplayers$&7]

# -------- 语言 --------
locale: zh_CN

# -------- 资源生成器配置 --------
resource:
  bronze:
    item:
      - type: NETHER_STAR
        amount: 1
        meta:
          ==: ItemMeta
          meta-type: UNSPECIFIC
          display-name: §4灵魂
    spawn-interval: 1000
    spread: 1.0
  iron:
    item:
      - type: IRON_INGOT
        meta:
          ==: ItemMeta
          meta-type: UNSPECIFIC
          display-name: §f铁
    spawn-interval: 1500
    spread: 1.0
  gold:
    item:
      - type: GOLD_INGOT
        meta:
          ==: ItemMeta
          meta-type: UNSPECIFIC
          display-name: §6金
    spawn-interval: 10000
    spread: 1.0
  diamond:
    item:
      - type: DIAMOND
        meta:
          ==: ItemMeta
          meta-type: UNSPECIFIC
          display-name: §b钻石
    spawn-interval: 30000
    spread: 1.0

# 经验模式对局：捡起的铁锭/金锭/钻石等资源自动换算成经验；商店价格按同一映射换算为经验扣除。
# 商店配置已按模式拆分：
#   shop/item_shop.yml —— 物品商店配置（原 shop.yml，已自动改名迁移），price 为资源物品列表
#   shop/xp_shop.yml   —— 经验商店配置（新增），结构同物品商店，price 直接写所需经验值（整数）
# 模式判定优先级：bwsba 编辑 GUI 里给对局单独设置的经验/物品模式（game.yml 的 xp-mode）优先；
# 未单独设置的对局回退到下面的全局开关与 games 列表。
xp-bedwars:
  enabled: true                 # 全局总开关（false = 未单独设置的对局全部为物品商店）
  games: []                         # 启用经验模式的对局名列表，如 [bedwars1, bedwars2]
  max-xp: 0                         # 单局经验上限（0 = 无上限）
  death-cost: 0.5              # 死亡扣除经验比例（0-1；0 = 不扣，0.5 = 死亡扣一半）
  resource-xp:                      # 资源类型 → 每单位经验值（拾取换算 & 商店价格换算共用）
    IRON_INGOT: 1                   # 注意：下界之星是击杀奖励（灵魂），不参与经验换算
    GOLD_INGOT: 10
    DIAMOND: 100

# -------- 更新检查 --------
check-updates: false
update-infos: false

# -------- 奖励系统 --------
rewards:
  enabled: false
  player-win:
